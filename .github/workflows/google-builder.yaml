name: Google Go Builder

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - ".github/workflows/google-builder.yaml"
jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:

      - name: Show workflow information
        run: |
          [ -n "$_NAME" ] || _NAME="$GOOS-$GOARCH"
          echo "GOOS: $GOOS, GOARCH: $GOARCH, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          repository: 'XTLS/Xray-core'
          ref: 'v26.9.9'
          path: 'xray'

      - name: Checkout patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Patch code
        run: |
          cd ${GITHUB_WORKSPACE}/xray
          patch --verbose -p 1 < ${GITHUB_WORKSPACE}/patch/de-gpl.diff
          cd ${GITHUB_WORKSPACE}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'xray/go.mod'
          check-latest: true

      - name: Get project dependencies
        run: |
          cd ${GITHUB_WORKSPACE}/xray
          go mod download
      
      - name: Build Xray
        run: |
          cd ${GITHUB_WORKSPACE}/xray
          mkdir -p ${GITHUB_WORKSPACE}/build_assets
          COMMID=$(git describe --always --dirty)
          if [[ ${GOOS} == 'windows' ]]; then
            echo 'Building Xray for Windows...'
            go build -o ${GITHUB_WORKSPACE}/build_assets/xray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags "-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
            # go build -o ${GITHUB_WORKSPACE}/build_assets/wxray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags "-H windowsgui -X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          else
            echo 'Building Xray...'
            go build -o ${GITHUB_WORKSPACE}/build_assets/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags "-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          fi

      - name: Copy README.md & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/xray/README.md ${GITHUB_WORKSPACE}/build_assets/README.md
          cp ${GITHUB_WORKSPACE}/xray/LICENSE ${GITHUB_WORKSPACE}/build_assets/LICENSE

      - name: Create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          pushd ${GITHUB_WORKSPACE}/build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ${GITHUB_WORKSPACE}/Xray-google-go-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=${GITHUB_WORKSPACE}/Xray-google-go-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Xray-google-go-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Xray-google-go-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true